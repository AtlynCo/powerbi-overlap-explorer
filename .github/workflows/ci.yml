name: Visual quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm exec playwright -- install chromium
      - run: npm run check
      - run: npm run audit
      - uses: actions/upload-artifact@v4
        with:
          name: atlyn-overlap-explorer-package
          path: |
            dist/*.pbiviz
            dist/artifact.sha256
          if-no-files-found: error
